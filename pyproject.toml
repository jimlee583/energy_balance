[project]
name = "energy-balance"
version = "0.1.0"
description = "Satellite energy balance simulator with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "plotly>=5.22",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_balance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# UP042: prefer `(str, Enum)` for clear pydantic/json string serialization.
# RUF005: `list(...) + [...]` is perfectly readable here.
ignore = ["E501", "UP042", "RUF005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
